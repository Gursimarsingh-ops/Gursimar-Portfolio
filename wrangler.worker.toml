# ---------------------------------------------------------------------------
# Standalone Worker target — used for local development against the SAME
# production D1 (and the Backblaze B2 bucket), and available as an alternative
# deploy if the site is ever moved from Pages to a Worker. It is NOT used by the
# Pages build. No R2 binding: object storage is Backblaze B2 only.
#
#   shared (default)  npm run dev:api       -> production D1 + R2
#   offline only      npm run dev:api:local -> emulated .wrangler/state
#
# Shared mode needs `npx wrangler login` once. Offline mode never touches
# production data.
# ---------------------------------------------------------------------------

name = "gursimar-portfolio-api"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "5ace7b4b-a18a-4b6d-aa9f-8b4948b273ec"
remote = true

[vars]
APP_NAME = "Gursimar Singh Portfolio"
B2_BUCKET_NAME = "gursimar-portfolio"
B2_REGION = "us-east-005"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"

# B2_APPLICATION_KEY_ID and B2_APPLICATION_KEY are secrets: put them in
# .dev.vars for local development (see .dev.vars.example).
