name = "gursimar-portfolio"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

# Built SPA (index.html + assets) is uploaded from ./dist.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
# Replace with the real database_id from `wrangler d1 create portfolio-db`.
database_id = "00000000-0000-4000-8000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "portfolio-media"

[vars]
# Non-secret configuration. ADMIN_EMAIL and ADMIN_PASSWORD_HASH are secrets.
APP_NAME = "Gursimar Singh Portfolio"
