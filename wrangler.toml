# ---------------------------------------------------------------------------
# Production: Cloudflare Pages project "gursimar-portfolio"
# URL: https://gursimar-portfolio.pages.dev/  (unchanged)
#
# This file is read by Cloudflare Pages (Git-connected build on branch `main`)
# and by `wrangler pages deploy`. It intentionally has NO `main` entry: Pages
# serves ./dist as static assets and runs the backend through Pages Functions.
#
#   functions/api/[[path]].ts   -> /api/*   (admin, inquiries, chat, AI, health)
#   functions/media/[[path]].ts -> /media/* (Backblaze B2 images and videos)
#
# There is deliberately NO R2 binding: Cloudflare R2 is not enabled on this
# account and requiring it made every Pages deployment fail. All object storage
# goes to the private Backblaze B2 bucket through the S3-compatible API, signed
# server-side inside the Worker. Cloudflare only needs the D1 binding below (or
# the D1 binding configured under Settings -> Functions -> Bindings).
# ---------------------------------------------------------------------------

name = "gursimar-portfolio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
# Real id from `npx wrangler d1 create portfolio-db` (or `npx wrangler d1 list`).
# The placeholder keeps `npm run build` honest: it makes `npm run deploy:check`
# fail instead of shipping a site whose dashboard writes nowhere.
database_id = "00000000-0000-4000-8000-000000000000"

[vars]
# Non-secret configuration. ADMIN_EMAIL, ADMIN_PASSWORD_HASH, AI_API_KEY and the
# two Backblaze application key values are Pages secrets
# (Settings -> Variables and Secrets), never this file.
APP_NAME = "Gursimar Singh Portfolio"

# Private Backblaze B2 bucket (S3-compatible API). The bucket is never made
# public: media is streamed through /media/* by the Worker.
B2_BUCKET_NAME = "gursimar-portfolio"
B2_REGION = "us-east-005"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
